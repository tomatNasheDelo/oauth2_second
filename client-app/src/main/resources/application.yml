server:
  port: 8080

spring:
  application:
    name: client-app
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: demo-client
            client-secret: ${OAUTH_CLIENT_SECRET:demo-client-secret-change-me}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/learning}

app:
  resource-server-url: ${RESOURCE_SERVER_URL:http://localhost:8081}
