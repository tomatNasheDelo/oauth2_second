services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-learning.json:/opt/keycloak/data/import/realm-learning.json:ro
